name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build unsigned release
        run: gradle --no-daemon assembleRelease
      - name: SHA-256
        run: |
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee app/build/outputs/apk/release/SHA256SUMS.txt
          printf 'commit=%s\\n' "$GITHUB_SHA" | tee app/build/outputs/apk/release/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: psa-lyric-unsigned-${{ github.sha }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/apk/release/BUILD_INFO.txt
          if-no-files-found: error
